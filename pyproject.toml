[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaca"
version = "1.0.0"
description = "Gravitational Accretion Clustering Algorithm: scalable, physics-inspired density clustering"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Henri J. Vuorinen" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
experiments = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "hdbscan>=0.8",
    "lightgbm>=4.0",
    "psutil>=5.9",
    "pyarrow>=14",
]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["gaca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
